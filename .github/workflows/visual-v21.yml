name: Capture MIRA LINK v2.1 visuals

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture screens
        run: npx playwright test tests/e2e/visual-v21.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mira-v21-screens
          path: visual-artifacts
          if-no-files-found: warn
