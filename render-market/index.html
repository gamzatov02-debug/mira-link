const total=()=>products.reduce((n,p,i)=>n+p.price*s.cart[i],0),count=()=>s.cart.reduce((a,b)=>a+b,0),discount=()=>s.useBonus?Math.min(s.balance,Math.floor(total()/2)):0;
const active=()=>s.orders.find(o=>['paid','opened','issue'].includes(o.status));
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch{storageOK=false;}}
const btn=(text,action,cls='cta')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
const back=()=>btn('← К витрине','catalog','back');
function controls(i){return s.cart[i]?`<div class="stepper"><button data-minus="${i}" aria-label="Убрать ${products[i].name}">−</button><span>${s.cart[i]}</span><button data-plus="${i}" aria-label="Добавить ${products[i].name}" ${s.cart[i]>=s.stock[i]?'disabled':''}>+</button></div>`:`<button class="add" data-plus="${i}" ${!s.stock[i]?'disabled':''}>${s.stock[i]?'+ Добавить':'Нет в наличии'}</button>`;}
function card(i){const p=products[i];return `<article class="product"><button class="open-product" data-product="${i}"><img class="photo" src="${image(i)}" alt="${p.name}"><span class="product-title">${p.name}</span></button><span class="weight">${p.weight} · Осталось ${s.stock[i]}</span><div class="buy-row"><span class="price">${money(p.price)}</span>${controls(i)}</div></article>`;}
function grid(){const ids=products.map((_,i)=>i).filter(i=>(category==='Всё'||products[i].cat===category)&&products[i].name.toLowerCase().includes(query.toLowerCase().trim()));document.getElementById('grid').innerHTML=ids.map(card).join('')||'<p>Товары не найдены</p>';document.getElementById('found').textContent=ids.length+' товаров';}
function footer(){document.getElementById('count').textContent=count();document.getElementById('sum').textContent=money(total());document.querySelector('.basket').hidden=['kiosk','checkout','receipt'].includes(page);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));}
function receipt(o){if(!o)return '<h2>Покупок пока нет</h2>'+back();const status={paid:'Оплачено · ожидает получения',opened:'Ячейка открыта',received:'Покупка получена',issue:'Проблема с выдачей',refunded:'Возврат выполнен'};return `<h2>${status[o.status]}</h2><p class="muted">Заказ ${o.id} · ${kiosk}</p><div class="bonus-box">${o.items.map(x=>`<div class="line"><span>${products[x.i].name} × ${x.qty}</span><b>${money(products[x.i].price*x.qty)}</b></div>`).join('')}<hr><div class="line"><span>Тестовая оплата · ${o.method}</span><b>${money(o.paid)}</b></div><div class="line"><span>Бонусами</span><b>${o.bonus}</b></div></div><p class="note">Демонстрационное подтверждение, не кассовый чек. Реальные деньги не списаны.</p>`+(o.status==='paid'?`<div class="pickup-code">Ячейка 03 · код ${o.code}</div><p>В демо кнопка имитирует команду замку киоска.</p>${btn('Открыть ячейку · демо','open')}${btn('Ячейка не открылась','issue','secondary')}`:o.status==='opened'?`<p>Заберите товары из ячейки 03 и закройте дверцу.</p>${btn('Товары забраны, дверца закрыта','receive')}${btn('Товара нет / проблема','issue','secondary')}`:o.status==='issue'?`<p>Получение не подтверждено. Повторите открытие или выполните тестовый возврат.</p>${btn('Повторить открытие','retry')}${btn('Оформить возврат · демо','refund','secondary')}`:o.status==='received'?'<p>Спасибо за покупку! Статус сохранён в истории.</p>'+btn('Новая покупка','catalog'): '<p>Тестовая оплата возвращена, бонусы и остатки восстановлены.</p>'+btn('К витрине','catalog'));}
function render(){let html='';
if(page==='kiosk')html=`<h2>Покупка у киоска</h2><p>МФЦ · Дербент · 1 этаж</p><div class="qr-card"><img src="kiosk-qr.svg" alt="QR киоска MFC-DERBENT-01" width="220" height="220"></div><p class="note">Отсканируйте QR обычной камерой телефона. Он открывает витрину этой точки. На том же устройстве нажмите кнопку ниже.</p>${btn('Открыть витрину этого киоска','catalog')}<p class="note">Сценарий демо: оплата → открытие ячейки → получение. Оборудование не подключено.</p>`;
else if(page==='catalog'){main.innerHTML=`<div class="pad"><div class="location"><b>МФЦ · Дербент <span>/ 1 этаж</span></b><span>● Демо</span></div>${active()?btn('Оплаченная покупка · получить','receipt'):''}<button class="loyalty" data-action="bonus"><b>${s.balance.toLocaleString('ru-RU')}</b> бонусов MIRA<span class="spacer"></span>◎</button><div class="tools"><input id="search" placeholder="Поиск товара" aria-label="Поиск товара"><button class="cta" data-action="scan">Штрихкод</button></div><div class="categories">${['Всё','Готовая еда','Сэндвичи','Напитки','Снеки','Десерты'].map(c=>`<button class="chip" data-category="${c}" aria-pressed="${c===category}">${c}</button>`).join('')}</div><div class="section-heading"><h2>Витрина</h2><span id="found" class="muted"></span></div><div id="grid" class="grid"></div><div class="help-row">${btn('QR киоска','kiosk','back')}${btn('Как купить','help','back')}</div></div>`;document.getElementById('search').value=query;grid();footer();return;}
else if(page==='product'){const p=products[selected];html=back()+`<img class="detail-photo" src="${image(selected)}" alt="${p.name}"><h2>${p.name}</h2><p>${p.weight} · ${money(p.price)}</p>${controls(selected)}<p class="note">Демонстрационный товар. Состав, аллергены и сроки годности заполняются поставщиком для реальной продажи.</p>`+btn('Перейти в корзину','cart');}
else if(page==='cart')html=back()+'<h2>Ваша корзина</h2>'+(!count()?'<p>Выберите товары в витрине.</p>':s.cart.map((qty,i)=>qty?`<div class="cart-item"><img src="${image(i)}" alt=""><div><h3>${products[i].name}</h3><p>${money(products[i].price)} × ${qty}</p>${controls(i)}</div></div>`:'').join('')+`<div class="bonus-box"><label>Списать бонусы<input type="checkbox" id="use-bonus" ${s.useBonus?'checked':''}></label><p class="note">Доступно ${s.balance}. Демоусловие: до 50% покупки.</p></div><div class="line"><span>Сумма</span><b>${money(total())}</b></div><div class="line"><span>Бонусами</span><b>−${discount()}</b></div><div class="line total"><span>К оплате</span><b>${money(total()-discount())}</b></div>`+btn('Перейти к оплате','checkout'));
else if(page==='checkout')html=back()+`<h2>Тестовая оплата</h2><p>Киоск ${kiosk}</p><div class="balance">${money(total()-discount())}</div><label>Способ оплаты<select id="method"><option>СБП</option><option>Банковская карта</option></select></label><p class="note">Симулятор платежа. Номер карты и банковское приложение не нужны. Деньги не списываются.</p>${message?`<p role="alert" class="error">${message}</p>`:''}${btn('Оплатить успешно · демо','pay')}${btn('Проверить отказ оплаты','fail','secondary')}${btn('Отменить и вернуться в корзину','cart','back')}`;
else if(page==='receipt')html=receipt(active()||s.orders[0]);
else if(page==='orders')html=back()+'<h2>Мои покупки</h2>'+(!s.orders.length?'<p>Покупок пока нет.</p>':s.orders.map(o=>`<section class="order">${receipt(o)}</section>`).join(''));
else if(page==='scan')html=back()+`<h2>Штрихкод товара</h2><div class="scan-frame">▥</div><p>Симулятор сканера: выберите результат считывания.</p><p class="note">Камера товара в демо не подключена. QR входа в киоск сканируется камерой телефона.</p>${products.map((p,i)=>`<button class="secondary" data-product="${i}">${p.name}</button>`).join('')}${btn('Неизвестный штрихкод','unknown','back')}${message?'<p role="alert">'+message+'</p>':''}`;
else if(page==='bonus')html=back()+`<h2>Бонусы MIRA</h2><div class="balance">${s.balance.toLocaleString('ru-RU')}</div><p>1 бонус = 1 ₽. До 50% покупки.</p><p class="note">Тестовый баланс этого сценария. В рабочей экосистеме используется общий бонусный счёт. Начисление новых бонусов в этом демо не моделируется.</p>`+btn('Использовать в корзине','cart');
else if(page==='profile')html=back()+'<h2>Демоаккаунт</h2><p>Покупки и остатки сохраняются в этом браузере.</p>'+btn('История покупок','orders')+btn('Начать демо заново','reset-confirm','secondary');
else if(page==='reset-confirm')html='<h2>Сбросить демонстрацию?</h2><p>Удалятся только тестовые покупки этого микромаркета. Восстановятся товары и 1 250 бонусов.</p>'+btn('Сбросить демо','reset')+btn('Отмена','profile','secondary');
else html=back()+'<h2>Как купить</h2><ol><li>Отсканируйте QR киоска.</li><li>Добавьте товары в корзину.</li><li>Выберите бонусы и тестовую оплату.</li><li>Откройте ячейку.</li><li>Подтвердите получение и закрытие дверцы.</li></ol><p>При ошибке выдачи доступна повторная попытка или тестовый возврат.</p>';
main.innerHTML='<div class="panel">'+html+(!storageOK?'<p role="alert">Браузер запретил сохранение. Не закрывайте страницу до завершения демо.</p>':'')+'</div>';footer();}
function act(a){message='';const o=active();
if(a==='pay'){if(!count()||o){page=o?'receipt':'cart';render();return;}if(s.cart.some((q,i)=>q>s.stock[i])){page='cart';render();return;}const method=document.getElementById('method').value,amount=total(),b=discount();const id='MM-'+Date.now().toString(36).toUpperCase();s.orders.unshift({id,code:String(Math.floor(100000+Math.random()*900000)),items:s.cart.flatMap((qty,i)=>qty?[{i,qty}]:[]),paid:amount-b,bonus:b,status:'paid',method});s.balance-=b;s.cart.forEach((q,i)=>s.stock[i]-=q);s.cart.fill(0);s.useBonus=false;page='receipt';}
else if(a==='fail'){message='Платёж отклонён. Деньги и бонусы не списаны. Повторите оплату или вернитесь в корзину.';page='checkout';}
else if(a==='open'&&o?.status==='paid'){o.status='opened';page='receipt';}
else if(a==='receive'&&o?.status==='opened'){o.status='received';page='receipt';}
else if(a==='issue'&&o){o.status='issue';page='receipt';}
else if(a==='retry'&&o?.status==='issue'){o.status='paid';page='receipt';}
else if(a==='refund'&&o?.status==='issue'){o.status='refunded';s.balance+=o.bonus;o.items.forEach(x=>s.stock[x.i]+=x.qty);page='receipt';}
else if(a==='unknown'){message='Товар не найден. Выберите его в витрине или обратитесь к оператору.';page='scan';}
else if(a==='reset'){s=fresh();page='kiosk';}
else if(['open','receive','issue','retry','refund'].includes(a)){page='receipt';}
else page=a;
if(page==='checkout'&&!count())page='cart';save();render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.plus!==undefined||b.dataset.minus!==undefined){const i=Number(b.dataset.plus??b.dataset.minus);s.cart[i]=Math.max(0,Math.min(s.stock[i],s.cart[i]+(b.dataset.plus!==undefined?1:-1)));save();render();document.getElementById('status').textContent='В корзине '+count()+' товаров';return;}
if(b.dataset.product!==undefined){selected=Number(b.dataset.product);page='product';render();return;}
if(b.dataset.category){category=b.dataset.category;render();return;}
const a=b.dataset.action||b.dataset.page;if(a)act(a);
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;grid();}});
document.addEventListener('change',e=>{if(e.target.id==='use-bonus'){s.useBonus=e.target.checked;save();render();}});
render();
})();
</script></body></html>
